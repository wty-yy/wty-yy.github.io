<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7ef">
  <title>慢慢骑 · 鹈鹕的海边兜风日</title>
  <style>
    :root { color-scheme: light; --paper: #f7f7ef; --ink: #244e48; --muted: #81918a; --line: #dce3d8; --orange: #e79963; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .page { max-width: 1320px; margin: auto; padding: 0 48px; }
    .masthead { height: 91px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 39px; height: 39px; }
    .brand-name { font-weight: 750; font-size: 19px; letter-spacing: 3px; }
    .brand-subtitle { font-size: 8px; letter-spacing: 2.2px; margin-top: 3px; }
    .edition { display: flex; align-items: center; gap: 13px; font-size: 11px; letter-spacing: 1.5px; }
    .edition i { width: 6px; height: 6px; background: #81a78f; border-radius: 50%; }
    .intro { text-align: center; padding: 36px 0 29px; }
    .eyebrow { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 11px; letter-spacing: 3px; color: #768f7e; }
    .eyebrow svg { width: 23px; height: 17px; }
    h1 { margin: 12px 0 9px; font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif; font-weight: 600; font-size: clamp(28px, 3.2vw, 43px); letter-spacing: 4px; }
    .intro p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: 2px; }
    .postcard { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid #d9e4d9; background: #eaf1e7; }
    .scene { width: 100%; height: auto; display: block; }
    .scene text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .scene .serif { font-family: Georgia, "Times New Roman", serif; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 2px; gap: 20px; }
    .ride-note { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 1px; color: #7f9186; }
    .ride-note svg { width: 21px; height: 21px; }
    .controls { display: flex; align-items: center; gap: 20px; }
    .play-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-width: 94px; height: 40px; padding: 0 17px; border: 1px solid #d0ddd0; border-radius: 30px; background: transparent; color: var(--ink); font-size: 12px; cursor: pointer; transition: background .2s, border-color .2s; }
    .play-button:hover { background: #e8eee2; border-color: #a8bdab; }
    .play-button svg { width: 12px; height: 14px; }
    .speed-control { display: flex; align-items: center; gap: 4px; padding: 4px; background: #e9eee3; border-radius: 30px; }
    .speed-control button { border: 0; background: transparent; color: #7c9182; border-radius: 24px; padding: 7px 14px; font-size: 11px; cursor: pointer; transition: color .2s, background .2s, box-shadow .2s; }
    .speed-control button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 5px #284f4810; }
    footer { display: flex; align-items: center; justify-content: space-between; min-height: 53px; border-top: 1px solid var(--line); color: #8e9b91; font-size: 9px; letter-spacing: 1.7px; }
    .footer-flower { color: #c39363; font-size: 16px; vertical-align: -2px; margin: 0 6px; }
    .pause-icon, .play-icon { fill: currentColor; }
    [hidden] { display: none !important; }
    @media (min-width: 1500px) { .page { max-width: 1420px; } .intro { padding-top: 43px; padding-bottom: 34px; } }
    @media (max-width: 700px) {
      .page { padding: 0 20px; } .masthead { height: 75px; } .brand-name { font-size: 17px; } .edition { font-size: 9px; letter-spacing: .5px; gap: 7px; }
      .intro { padding: 31px 0 25px; } h1 { letter-spacing: 1px; margin: 13px 0 12px; } .intro p { font-size: 10px; letter-spacing: 1px; }
      .postcard { border-radius: 15px; } .scene { width: 160%; max-width: none; margin-left: -30%; } .scene .corner-note { opacity: 0; }
      .toolbar { flex-direction: column; gap: 18px; padding: 22px 0 24px; } .controls { gap: 14px; } .ride-note { font-size: 11px; } footer { font-size: 8px; letter-spacing: .7px; gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

    <main>

        <div class="eyebrow"><svg viewBox="0 0 28 20" fill="none" aria-hidden="true"><path d="M1 6h18c6 0 5-7 1-5M5 11h18c5 0 4 7 0 6M1 16h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>不赶路，去感受风</div>
        <h1>把今天，骑成好天气。</h1>
        <p>一只鹈鹕，一辆单车，和一整个下午的海风。</p>

            <g data-plant="0" transform="translate(109 573)"><use href="#grass" transform="scale(1.15)"/><use href="#flower" x="20" y="3"/><use href="#flower" x="-19" y="6" transform="rotate(-17 -19 6)"/><path d="m-34 7 14-2m26 7 23-2" stroke="#acb58b" stroke-width="2" stroke-linecap="round"/></g>
            <g data-plant="1" transform="translate(1057 606)"><use href="#grass" x="-6" y="1"/><use href="#flower" x="13" y="-6" transform="scale(1.2)"/><use href="#flower" x="-27" y="-2" transform="rotate(-12 -27 -2)"/><use href="#grass" x="44" y="7" transform="rotate(13 44 7)"/></g>
            <g data-plant="2" transform="translate(1340 567)"><use href="#grass"/><use href="#flower" x="17" y="1"/></g>
          </g>
          <g class="corner-note" transform="translate(59 535) rotate(-8)"><rect x="-5" y="-34" width="130" height="45" rx="4" fill="#f6f4df" fill-opacity=".85"/><text x="60" y="-15" text-anchor="middle" class="serif" font-style="italic" font-size="14" fill="#839679">take the scenic route.</text><path d="M14-6q38 5 77-1" fill="none" stroke="#b9c0a0" stroke-width="1"/></g>
          <path d="M0 0h1200v620H0z" fill="url(#paper-grain)" pointer-events="none"/>
        </svg>
      </div>

      <div class="toolbar">
        <div class="ride-note"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span id="ride-note">海风刚好，慢一点也没关系。</span></div>
        <div class="controls" aria-label="动画控制">
          <button class="play-button" id="play-button" type="button" aria-label="暂停动画">
            <svg class="pause-icon" viewBox="0 0 12 14" aria-hidden="true"><rect x="2" y="2" width="2.5" height="10" rx="1"/><rect x="7.5" y="2" width="2.5" height="10" rx="1"/></svg>
            <svg class="play-icon" viewBox="0 0 12 14" aria-hidden="true" hidden><path d="m2 1 9 6-9 6Z"/></svg>
            <span id="play-label">暂停</span>
          </button>
          <div class="speed-control" role="group" aria-label="骑行速度">
            <button type="button" data-speed="0.6" aria-pressed="false">慢悠悠</button>
            <button type="button" data-speed="1" aria-pressed="true">去兜风</button>
            <button type="button" data-speed="1.7" aria-pressed="false">追着风</button>
          </div>
        </div>
      </div>
    </main>

    <footer><span>A LITTLE RIDE. A LOT OF JOY.</span><span>留一点时间，给无所事事 <span class="footer-flower" aria-hidden="true">✳</span></span></footer>
  </div>

  <script>
    (() => {
      'use strict';

      const byId = (id) => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const playButton = byId('play-button');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const parts = Object.fromEntries([
        'cyclist', 'bird-body', 'rear-spokes', 'front-spokes', 'bike-shadow',
        'near-leg', 'near-leg-highlight', 'far-leg', 'near-foot', 'far-foot',
        'near-crank', 'near-crank-shine', 'far-crank', 'near-pedal',
        'near-pedal-shine', 'far-pedal', 'road-dashes', 'road-specks',
        'water-lines', 'gulls', 'sailboat', 'breeze', 'scarf-tail', 'scarf-tail-back',
      ].map((id) => [id, byId(id)]));
      const clouds = [...document.querySelectorAll('[data-cloud]')];
      const plants = [...document.querySelectorAll('[data-plant]')];
      const cloudPositions = [[139, 135, 1.25], [405, 87, .78], [1021, 230, .87]];
      const plantPositions = [[109, 573], [1057, 606], [1340, 567]];
      let running = !motionPreference.matches;
      let speed = 1;
      let time = 0;
      let previousTime = null;
      let frameId = null;

      function path(id, value) { parts[id].setAttribute('d', value); }
      function transform(id, value) { parts[id].setAttribute('transform', value); }
      function wrap(value, start, length) { return ((value - start) % length + length) % length + start; }

      // Intersect two equal-radius circles to keep both leg segments the same
      // length. Choose the forward knee so the leg bends naturally while pedaling.
      function legPath(hipX, hipY, footX, footY) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.hypot(dx, dy);
        const bend = Math.sqrt(Math.max(0, 83 * 83 - distance * distance / 4));
        const kneeX = (hipX + footX) / 2 + dy / distance * bend;
        const kneeY = (hipY + footY) / 2 - dx / distance * bend;
        return `M${hipX} ${hipY}Q${hipX + 6} ${hipY + 8} ${kneeX} ${kneeY}L${footX} ${footY}`;
      }

      function draw() {
        const phase = time * 2.8;
        const degrees = phase * 180 / Math.PI;
        const bounce = Math.sin(phase * 2) * 1.25;
        const bodyBob = Math.sin(phase * 2 - .35) * 1.7;
        const pedalX = Math.cos(phase) * 37;
        const pedalY = Math.sin(phase) * 37;
        const nearX = 590 + pedalX;
        const nearY = 477 + pedalY;
        const farX = 590 - pedalX;
        const farY = 477 - pedalY;

        transform('cyclist', `translate(0 ${bounce})`);
        transform('bird-body', `translate(0 ${bodyBob})`);
        // Gear ratio 1.65; scenery speed matches the tire's rolling distance.
        transform('rear-spokes', `rotate(${degrees * 1.65 % 360})`);
        transform('front-spokes', `rotate(${degrees * 1.65 % 360})`);
        parts['bike-shadow'].setAttribute('rx', 289 + bounce * 1.4);

        const nearLeg = legPath(587, 353 + bodyBob, nearX, nearY - 5);
        path('near-leg', nearLeg);
        path('near-leg-highlight', nearLeg);
        path('far-leg', legPath(570, 352 + bodyBob, farX, farY - 5));
        path('near-crank', `M590 477L${nearX} ${nearY}`);
        path('near-crank-shine', `M590 477L${nearX} ${nearY}`);
        path('far-crank', `M590 477L${farX} ${farY}`);
        transform('near-foot', `translate(${nearX} ${nearY - 4}) rotate(${Math.sin(phase) * 9})`);
        transform('far-foot', `translate(${farX} ${farY - 4}) rotate(${-Math.sin(phase) * 9})`);
        path('near-pedal', `M${nearX - 14} ${nearY + 4}h28`);
        path('near-pedal-shine', `M${nearX - 10} ${nearY + 2}h20`);
        path('far-pedal', `M${farX - 12} ${farY + 4}h24`);

        const roadDistance = time * 2.8 * 1.65 * 96;
        transform('road-dashes', `translate(${-roadDistance % 220} 0)`);
        transform('road-specks', `translate(${-roadDistance % 1400} 0)`);
        clouds.forEach((cloud, index) => {
          const [x, y, scale] = cloudPositions[index];
          const drift = wrap(x - time * (7 + index * 2), -150, 1520);
          cloud.setAttribute('transform', `translate(${drift} ${y + Math.sin(time * .4 + index) * 3}) scale(${scale})`);
        });
        plants.forEach((plant, index) => {
          const [x, y] = plantPositions[index];
          plant.setAttribute('transform', `translate(${wrap(x - roadDistance, -100, 1540)} ${y})`);
        });
        transform('water-lines', `translate(${-time * 8 % 80} 0)`);
        transform('gulls', `translate(${Math.sin(time * .28) * 20} ${Math.sin(time * 1.5) * 3})`);
        transform('sailboat', `translate(${wrap(1029 - time * 3, -50, 1400)} ${351 + Math.sin(time * 1.4) * 1.5})`);
        parts.breeze.setAttribute('opacity', .45 + Math.sin(time * 3) * .2);
        transform('breeze', `translate(${Math.sin(time * 2) * 5} 0)`);
        const flutter = Math.sin(time * 7) * 5;
        const flutterBack = Math.sin(time * 7 - 1) * 4;
        path('scarf-tail', `M653 224Q620 ${232 + flutter} 602 ${220 + flutter}T567 ${223 - flutter / 2}l9 8-7 9q20-5 34 2t52-7Z`);
        path('scarf-tail-back', `M660 220Q625 ${200 + flutterBack} 597 ${216 + flutterBack}T544 ${211 - flutterBack}l13 15-8 9q30 8 53-2t60 2Z`);
      }

      function tick(timestamp) {
        frameId = null;
        if (!running || document.hidden) return;
        if (previousTime !== null) time += Math.min((timestamp - previousTime) / 1000, .05) * speed;
        previousTime = timestamp;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        previousTime = null;
        playButton.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
        byId('play-label').textContent = running ? '暂停' : '继续';
        playButton.querySelector('.pause-icon').toggleAttribute('hidden', !running);
        playButton.querySelector('.play-icon').toggleAttribute('hidden', running);
        if (running && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      playButton.addEventListener('click', () => {
        running = !running;
        syncPlayback();
      });
      speedButtons.forEach((button) => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          speedButtons.forEach((option) => option.setAttribute('aria-pressed', String(option === button)));
          const notes = { '0.6': '慢悠悠，把沿途的风景都收藏。', '1': '海风刚好，慢一点也没关系。', '1.7': '跟上风，快乐正在前方招手。' };
          byId('ride-note').textContent = notes[button.dataset.speed];
        });
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', (event) => {
        running = !event.matches;
        syncPlayback();
      });
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
