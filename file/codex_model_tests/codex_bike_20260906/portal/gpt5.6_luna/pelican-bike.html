<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16324f;
      --muted: #607386;
      --paper: #f4f0e8;
      --line: #cad6d9;
      --coral: #e96d58;
      --yellow: #f4c95d;
      --sky: #c8e5e7;
      --road: #16324f;
      --speed: 1;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #d7e1e1;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frame {
      width: min(1440px, 100vw);
      min-height: min(900px, 100vh);
      padding: clamp(18px, 3vw, 42px);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background: var(--paper);
    }

    .scene-shell {
      width: min(1180px, 100%);
      position: relative;
    }

    .scene-meta {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 4px 15px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: .14em;
      font-size: 11px;
      font-weight: 800;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      font-size: 10px;
      letter-spacing: 0;
    }

    .scene-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .scene-title::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--coral);
    }

    .artboard {
      position: relative;
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid #b5c7ca;
      background: var(--sky);
      box-shadow: 0 18px 45px rgba(22, 50, 79, .12);
      aspect-ratio: 1.58 / 1;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(22, 50, 79, .9);
      box-shadow: 0 10px 22px rgba(22, 50, 79, .16);
    }

    .control-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .control-button:hover,
    .control-button:focus-visible {
      outline: none;
      border-color: var(--yellow);
      background: rgba(255, 255, 255, .14);
      transform: translateY(-1px);
    }

    .control-button[aria-pressed="true"] { color: var(--yellow); }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid currentColor;
    }

    .pause-icon {
      width: 10px;
      height: 12px;
      border-right: 3px solid currentColor;
      border-left: 3px solid currentColor;
    }

    .reset-icon {
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      position: relative;
    }

    .reset-icon::after {
      content: "";
      position: absolute;
      top: -4px;
      left: -2px;
      border-top: 5px solid currentColor;
      border-right: 5px solid transparent;
    }

    .speed-indicator {
      width: 42px;
      height: 34px;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, .72);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .footer-note {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 4px 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer-note span:last-child { color: var(--coral); }

    /* SVG animation timing is centralized here so the pause control stays exact. */
    .animated { animation-duration: calc(var(--duration, 1s) / var(--speed)); }
    .cloud-back { animation: drift-back 24s linear infinite; }
    .cloud-front { animation: drift-front 17s linear infinite; }
    .scenery { animation: scenery-move 9s linear infinite; }
    .scenery.slow { animation-duration: 18s; }
    .pelican-bob { animation: body-bob 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .wing-flap { animation: wing-flap 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 65% 12%; }
    .leg-left { animation: pedal-left 1.1s linear infinite; transform-box: fill-box; transform-origin: 50% 8%; }
    .leg-right { animation: pedal-right 1.1s linear infinite; transform-box: fill-box; transform-origin: 50% 8%; }
    .wheel { animation: wheel-spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .handle-tassel { animation: tassel-sway .8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
    .water-line { animation: water-shimmer 2.8s ease-in-out infinite alternate; }
    .paused * { animation-play-state: paused !important; }

    @keyframes body-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg) translateY(-2px); }
    }

    @keyframes pedal-left {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pedal-right {
      from { transform: rotate(180deg); }
      to { transform: rotate(540deg); }
    }

    @keyframes wheel-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes drift-back {
      from { transform: translateX(0); }
      to { transform: translateX(-150px); }
    }

    @keyframes drift-front {
      from { transform: translateX(80px); }
      to { transform: translateX(-220px); }
    }

    @keyframes scenery-move {
      from { transform: translateX(0); }
      to { transform: translateX(-380px); }
    }

    @keyframes tassel-sway {
      from { transform: rotate(-7deg); }
      to { transform: rotate(8deg); }
    }

    @keyframes water-shimmer {
      from { opacity: .3; transform: translateX(0); }
      to { opacity: .85; transform: translateX(24px); }
    }

    @media (max-width: 640px) {
      .frame { padding: 14px; min-height: 100svh; }
      .scene-meta { min-height: 56px; }
      .brand { font-size: 9px; }
      .brand-mark { width: 24px; height: 24px; }
      .scene-title { font-size: 8px; letter-spacing: .12em; }
      .artboard { margin-top: 14px; aspect-ratio: .92 / 1; }
      .controls { right: 12px; bottom: 12px; }
      .footer-note { font-size: 8px; }
      .footer-note span:first-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="frame">

  <script>
    const root = document.documentElement;
    const pauseButton = document.querySelector('#pauseButton');
    const resetButton = document.querySelector('#resetButton');
    const speedIndicator = document.querySelector('#speedIndicator');
    let speed = 1;

    pauseButton.addEventListener('click', () => {
      const paused = root.classList.toggle('paused');
      pauseButton.setAttribute('aria-pressed', String(paused));
      pauseButton.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      pauseButton.firstElementChild.className = paused ? 'play-icon' : 'pause-icon';
    });

    resetButton.addEventListener('click', () => {
      root.classList.remove('paused');
      pauseButton.setAttribute('aria-pressed', 'false');
      pauseButton.setAttribute('aria-label', '暂停动画');
      pauseButton.firstElementChild.className = 'pause-icon';
      document.querySelectorAll('.animated, .cloud-back, .cloud-front, .scenery, .pelican-bob, .wing-flap, .leg-left, .leg-right, .wheel, .handle-tassel, .water-line').forEach((element) => {
        element.style.animation = 'none';
        element.offsetHeight;
        element.style.animation = '';
      });
    });

    speedIndicator.addEventListener('click', () => {
      speed = speed === 1 ? 1.35 : speed === 1.35 ? .75 : 1;
      root.style.setProperty('--speed', speed);
      speedIndicator.textContent = speed + '×';
    });
    speedIndicator.setAttribute('role', 'button');
    speedIndicator.setAttribute('tabindex', '0');
    speedIndicator.setAttribute('aria-label', '切换动画速度');
    speedIndicator.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        speedIndicator.click();
      }
    });
  </script>
</body>
</html>
