<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 2D Animation</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18324a;
      --coral: #ef6b57;
      --yellow: #ffc857;
      --cream: #fff8e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d8f3ff;
      font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .stage {
      width: min(100vw, 1280px);
      aspect-ratio: 1200 / 760;
      position: relative;
      overflow: hidden;
      background: #b9eaf8;
      box-shadow: 0 22px 60px rgba(25, 80, 104, .2);
    }

    svg { width: 100%; height: 100%; display: block; }

    .cloud { animation: cloud-drift 24s linear infinite; }
    .cloud.slow { animation-duration: 35s; animation-delay: -12s; }
    .cloud.fast { animation-duration: 19s; animation-delay: -7s; }

    .road-dash { animation: road-flow 1.15s linear infinite; }
    .road-dash.delay { animation-delay: -.55s; }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 1.1s linear infinite;
    }

    .pedal-spin {
      transform-box: view-box;
      transform-origin: 630px 514px;
      animation: pedal-spin 1.1s linear infinite;
    }

    .pelican-bob { animation: pelican-bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: view-box; transform-origin: 627px 394px; animation: leg-a .55s ease-in-out infinite alternate; }
    .leg-b { transform-box: view-box; transform-origin: 656px 394px; animation: leg-b .55s ease-in-out infinite alternate; }
    .wing-flap { transform-box: view-box; transform-origin: 628px 328px; animation: wing-flap 1.1s ease-in-out infinite; }
    .feather-float { animation: feather-float 2.8s ease-in-out infinite; }
    .feather-float.two { animation-delay: -1.4s; }

    @keyframes cloud-drift {
      from { transform: translateX(-170px); }
      to { transform: translateX(1320px); }
    }
    @keyframes road-flow {
      from { transform: translateX(0); }
      to { transform: translateX(-190px); }
    }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes pedal-spin { to { transform: rotate(360deg); } }
    @keyframes pelican-bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    @keyframes leg-a { from { transform: rotate(18deg); } to { transform: rotate(-24deg); } }
    @keyframes leg-b { from { transform: rotate(-24deg); } to { transform: rotate(18deg); } }
    @keyframes wing-flap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
    @keyframes feather-float { 0%, 100% { opacity: .65; transform: translateY(0) rotate(0); } 50% { opacity: 1; transform: translateY(-13px) rotate(12deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="一只鹈鹕骑着自行车穿过海边小路的 SVG 二维动画">
    <svg viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只戴着蓝色帽子的鹈鹕踩着红色自行车，沿着海边道路前进。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#89d8f2" />
          <stop offset=".68" stop-color="#d9f7ff" />
          <stop offset="1" stop-color="#fff1c7" />
        </linearGradient>
        <linearGradient id="hillBack" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8ccfa7" />
          <stop offset="1" stop-color="#4c9d85" />
        </linearGradient>
        <linearGradient id="hillFront" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#b8dc90" />
          <stop offset="1" stop-color="#70b477" />
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#566978" />
          <stop offset="1" stop-color="#334554" />
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf2" />
          <stop offset="1" stop-color="#f4e9d4" />
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2=".3">
          <stop offset="0" stop-color="#f59b4c" />
          <stop offset="1" stop-color="#e86e4f" />
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="7" />
          <feOffset dy="8" />
          <feComponentTransfer><feFuncA type="linear" slope=".2" /></feComponentTransfer>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" />
        </filter>
      </defs>

      <!-- sky and sun -->
      <rect width="1200" height="760" fill="url(#sky)" />
      <circle cx="975" cy="127" r="67" fill="#fff0a5" opacity=".92" />
      <circle cx="975" cy="127" r="88" fill="#fff4b6" opacity=".2" filter="url(#soft)" />

      <!-- drifting clouds -->
      <g class="cloud fast" fill="#fff" opacity=".78">
        <path d="M38 157c0-21 18-38 41-38 10 0 20 4 27 10 8-24 31-40 58-40 34 0 62 27 62 61 0 3 0 6-1 9h19c22 0 40 16 40 36H38c0-21 0-26 0-38z"/>
      </g>
      <g class="cloud slow" fill="#fff" opacity=".58">
        <path d="M730 208c0-18 15-32 34-32 8 0 16 3 22 8 8-20 27-33 50-33 29 0 52 23 52 51 0 3 0 5-1 7h16c19 0 34 14 34 31H730v-32z"/>
      </g>
      <g class="cloud" fill="#fff" opacity=".52">
        <path d="M-190 310c0-17 14-31 32-31 8 0 16 3 21 8 7-18 25-30 46-30 27 0 49 22 49 48 0 3 0 5-1 7h15c18 0 32 13 32 30h-194v-32z"/>
      </g>

      <!-- distant hills -->
      <path d="M0 435C130 355 238 370 345 426c109 57 172 7 278-46 115-58 230-33 312 21 91 60 159 49 265-29v303H0z" fill="url(#hillBack)" />
      <path d="M0 501c119-91 210-74 301-17 80 50 145 37 244-5 108-45 192-24 277 28 102 62 212 53 378-52v202H0z" fill="url(#hillFront)" />
      <path d="M0 561c132-44 232-34 337 4 119 43 193 27 297-14 111-44 202-26 303 17 91 39 173 35 263-4v114H0z" fill="#9bc97b" opacity=".9" />

      <!-- little seaside details -->
      <g fill="#3d8d77" opacity=".72">
        <path d="M94 445l14-42 13 42-8-5-5 23-7-23z" />
        <path d="M160 470l12-36 11 36-7-4-4 21-6-21z" />
        <path d="M1033 454l13-39 12 39-8-5-5 25-7-25z" />
        <path d="M1107 480l11-33 10 33-6-4-4 19-6-19z" />
      </g>

      <!-- road -->
      <path d="M0 577c224-30 431-36 600-23 212 16 415 4 600-20v226H0z" fill="url(#road)" />
      <path d="M0 579c222-29 430-35 600-22 210 16 413 4 600-19" fill="none" stroke="#a9bbc1" stroke-width="6" opacity=".55" />
      <g fill="#f7df87" opacity=".9">
        <rect class="road-dash" x="70" y="667" width="120" height="10" rx="5" />
        <rect class="road-dash delay" x="330" y="653" width="120" height="10" rx="5" />
        <rect class="road-dash" x="590" y="649" width="120" height="10" rx="5" />
        <rect class="road-dash delay" x="850" y="638" width="120" height="10" rx="5" />
        <rect class="road-dash" x="1110" y="629" width="120" height="10" rx="5" />
      </g>
      <ellipse cx="625" cy="669" rx="280" ry="27" fill="#1d2c39" opacity=".32" filter="url(#soft)" />

      <!-- floating feathers -->
      <g class="feather-float" fill="#f5e9d0" opacity=".8">
        <path d="M397 383c-13-17-3-35 14-43-2 14 8 26 3 39-4 9-10 11-17 4z" />
        <path d="M850 345c-11-15-4-30 11-38-1 12 8 21 4 33-3 8-8 10-15 5z" />
      </g>
      <g class="feather-float two" fill="#f5e9d0" opacity=".7">
        <path d="M879 515c-9-14-2-28 12-34-1 11 7 20 3 30-3 7-8 9-15 4z" />
      </g>

      <!-- bicycle -->
      <g filter="url(#shadow)" aria-label="自行车">
        <!-- wheel tires -->
        <g class="wheel-spin">
          <circle cx="473" cy="570" r="91" fill="none" stroke="#1b2b3a" stroke-width="15" />
          <circle cx="473" cy="570" r="79" fill="none" stroke="#9aaeb5" stroke-width="3" opacity=".7" />
          <g stroke="#b9c8cc" stroke-width="2" opacity=".7">
            <path d="M473 491v158M394 570h158M417 514l112 112M529 514L417 626" />
          </g>
        </g>
        <g class="wheel-spin">
          <circle cx="765" cy="570" r="91" fill="none" stroke="#1b2b3a" stroke-width="15" />
          <circle cx="765" cy="570" r="79" fill="none" stroke="#9aaeb5" stroke-width="3" opacity=".7" />
          <g stroke="#b9c8cc" stroke-width="2" opacity=".7">
            <path d="M765 491v158M686 570h158M709 514l112 112M821 514L709 626" />
          </g>
        </g>
        <circle cx="473" cy="570" r="9" fill="#f5c34f" stroke="#1b2b3a" stroke-width="4" />
        <circle cx="765" cy="570" r="9" fill="#f5c34f" stroke="#1b2b3a" stroke-width="4" />

        <!-- frame -->
        <g fill="none" stroke="#ec674f" stroke-linecap="round" stroke-linejoin="round">
          <path d="M473 570L566 454l87 116H473z" stroke-width="12" />
          <path d="M566 454l55 4 32 112" stroke-width="12" />
          <path d="M653 570h112" stroke-width="10" />
          <path d="M621 458l31-58" stroke-width="9" />
          <path d="M566 454l-16-17" stroke-width="9" />
        </g>
        <path d="M540 433h61" stroke="#273b4c" stroke-width="12" stroke-linecap="round" />
        <path d="M646 398c9-14 25-15 38-7l24 14" fill="none" stroke="#273b4c" stroke-width="9" stroke-linecap="round" />
        <path d="M700 403l23-19" fill="none" stroke="#273b4c" stroke-width="9" stroke-linecap="round" />
        <path d="M717 384l17 4M716 397l17 4" stroke="#f5c34f" stroke-width="5" stroke-linecap="round" />
        <path d="M642 459c0 14-12 25-26 25s-25-11-25-25" fill="none" stroke="#f8d47b" stroke-width="5" />
        <g class="pedal-spin" fill="none" stroke="#263a4a" stroke-linecap="round">
          <circle cx="630" cy="514" r="11" stroke-width="7" />
          <path d="M630 514l0-42M630 514l38 21" stroke-width="7" />
          <path d="M617 469h26M661 527h22" stroke="#f5c34f" stroke-width="7" />
        </g>
        <path d="M396 508c31-23 72-23 103 0" fill="none" stroke="#ec674f" stroke-width="6" opacity=".8" />
        <path d="M735 508c31-23 72-23 103 0" fill="none" stroke="#ec674f" stroke-width="6" opacity=".8" />
      </g>

      <!-- pelican -->
      <g class="pelican-bob" filter="url(#shadow)" aria-label="鹈鹕">
        <!-- body -->
        <path d="M540 357c2-46 37-76 88-81 59-6 116 17 141 58 14 23 10 54-12 71-29 22-94 23-147 9-39-11-71-28-70-57z" fill="url(#body)" stroke="#243b4b" stroke-width="7" />
        <path d="M560 341c26-24 66-33 105-26 27 5 46 15 64 30-35 4-75 25-103 49-33-8-59-25-66-53z" fill="#f0e2c8" opacity=".9" />
        <!-- tail -->
        <path d="M548 351l-57-29c-11-5-20 6-12 15l54 46z" fill="#f7eedc" stroke="#243b4b" stroke-width="7" />
        <path d="M510 344l-33-16M513 355l-37-4" stroke="#d8cbb3" stroke-width="4" stroke-linecap="round" />
        <!-- neck -->
        <path d="M594 305c-22-15-30-41-22-67 8-28 34-43 61-35 22 7 35 29 29 53-4 16-14 28-29 37l18 30z" fill="url(#body)" stroke="#243b4b" stroke-width="7" />
        <path d="M587 292c13 4 27 1 39-8 12-9 20-23 20-38 0-8-3-15-7-21" fill="none" stroke="#d7c6a6" stroke-width="6" stroke-linecap="round" opacity=".8" />
        <!-- head -->
        <path d="M585 216c0-40 28-68 67-68 31 0 59 20 66 48 5 19-2 39-19 52-14 11-35 16-55 13-35-4-59-20-59-45z" fill="url(#body)" stroke="#243b4b" stroke-width="7" />
        <!-- cap -->
        <path d="M591 187c8-34 33-53 67-53 28 0 49 12 61 33-17-9-37-12-58-7-25 6-46 17-70 27z" fill="#3d8fc0" stroke="#243b4b" stroke-width="7" />
        <path d="M589 187c31-16 72-28 130-12" fill="none" stroke="#f3cc62" stroke-width="8" stroke-linecap="round" />
        <path d="M651 134c-6-17 4-31 19-38 1 13 8 22 3 34-3 8-12 10-22 4z" fill="#3d8fc0" stroke="#243b4b" stroke-width="6" />
        <!-- beak and pouch -->
        <path d="M689 205c48-8 93 0 141 22-22 12-57 20-96 16-17-2-32-10-45-20z" fill="url(#beak)" stroke="#243b4b" stroke-width="7" stroke-linejoin="round" />
        <path d="M695 222c36 8 80 11 123 5" fill="none" stroke="#b84f49" stroke-width="5" stroke-linecap="round" />
        <path d="M715 226c-1 26 9 54 36 69 27 15 65 8 77-9-29-17-50-37-63-60z" fill="#f28d6d" stroke="#243b4b" stroke-width="7" />
        <path d="M740 247c16 14 34 21 60 26" fill="none" stroke="#d56b5b" stroke-width="5" stroke-linecap="round" opacity=".75" />
        <!-- eye -->
        <circle cx="671" cy="190" r="12" fill="#fff" stroke="#243b4b" stroke-width="5" />
        <circle cx="674" cy="191" r="5" fill="#243b4b" />
        <circle cx="676" cy="188" r="2" fill="#fff" />
        <!-- wing -->
        <g class="wing-flap">
          <path d="M577 331c31-25 82-27 112-3 12 10 14 26 5 38-17 23-65 27-103 12-21-8-29-32-14-47z" fill="#f9f0dd" stroke="#243b4b" stroke-width="7" />
          <path d="M591 342c26-12 57-10 80 3M602 355c20-6 43-3 61 6" fill="none" stroke="#d7c6a6" stroke-width="5" stroke-linecap="round" />
        </g>
        <!-- legs -->
        <g class="leg-a" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M626 390l-11 66 16 57" stroke="#e77c48" stroke-width="12" />
          <path d="M631 514c-13 1-25 7-30 16M631 514c9 8 18 11 30 10" stroke="#ef9a56" stroke-width="7" />
        </g>
        <g class="leg-b" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M657 390l14 57-13 67" stroke="#e77c48" stroke-width="12" />
          <path d="M658 514c-12 7-19 14-24 25M658 514c11 2 21 0 30-6" stroke="#ef9a56" stroke-width="7" />
        </g>
        <!-- small scarf -->
        <path d="M589 271c22 16 48 18 73 10l-2 21c-25 12-52 9-72-8z" fill="#f2c24f" stroke="#243b4b" stroke-width="5" />
        <path d="M651 296l28 32-24-5-18-24z" fill="#f2c24f" stroke="#243b4b" stroke-width="5" />
      </g>

      <!-- foreground grass -->
      <g stroke="#3d8d68" stroke-width="5" stroke-linecap="round" opacity=".85">
        <path d="M52 700l8-34M62 700l22-27M108 712l-1-41M114 712l18-30M1138 690l8-37M1146 690l22-29M1087 711l-3-39M1093 711l19-31" />
      </g>
      <g fill="#f18a70" stroke="#3d8d68" stroke-width="3">
        <circle cx="90" cy="690" r="7"/><circle cx="127" cy="681" r="6"/>
        <circle cx="1121" cy="683" r="7"/><circle cx="1172" cy="669" r="6"/>
      </g>

      <!-- caption plate -->
      <g transform="translate(62 62)">
        <rect width="252" height="68" rx="34" fill="#ffffff" opacity=".68" />
        <circle cx="37" cy="34" r="18" fill="#ef6b57" />
        <path d="M29 35l7 7 13-16" fill="none" stroke="#fff8e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="68" y="30" fill="#18324a" font-size="20" font-weight="800">PELICAN EXPRESS</text>
        <text x="68" y="51" fill="#4b6d7b" font-size="13">海风里，慢慢骑</text>
      </g>
    </svg>
  </main>
</body>
</html>
